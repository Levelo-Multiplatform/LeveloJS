[package]
name = "levelo-wasm"
version = "0.1.0"
edition = "2024"
description = "WebAssembly bindings for LeveloJS."
license = "MIT"
repository = "https://github.com/Levelo-Multiplatform/LeveloJS"
homepage = "https://github.com/Levelo-Multiplatform/LeveloJS"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
levelo-core = { path = "../../levelo-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-test = "0.3"